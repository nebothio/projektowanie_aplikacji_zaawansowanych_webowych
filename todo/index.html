<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <link rel="stylesheet" href="public/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-dark">
        <div id="app" class="mx-auto w-25 bg-white vh-100">
            <h1>Co masz dzisiaj zrobić?</h1>
            <label for="todoInput">Dodaj zadanie</label>
            <input type="text" id="todoInputField"/>
            <button type="button" id="todoAddButton" class="btn btn-success">Dodaj zadanie</button>

            <div id="todoContainer" class="mt-3 d-grid gap-3"></div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="public/main.js" defer></script>
    </body>
</html>
